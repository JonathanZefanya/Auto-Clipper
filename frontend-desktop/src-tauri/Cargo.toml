[package]
name = "auto-clipper-desktop"
version = "0.8.0"
description = "Auto Clipper — aplikasi desktop (Tauri shell untuk UI web + backend Python)"
edition = "2021"
publish = false

[lib]
name = "auto_clipper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
